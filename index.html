<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control de Arduino</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.serialport/1.0.1/p5.serialport.min.js"></script>
</head>

<body>
    <h1 style="text-align: center;">Navegando entre garcas</h1>

    <div class="container">
        <!-- Grupo de botones de flechas y confirmar -->
        <div class="button-group">
            <div id="up" class="button">⬆️</div>
            <div id="confirm" class="button">✅</div>
            <div id="down" class="button">⬇️</div>
            <div id="left" class="button">⬅️</div>
            <div id="right" class="button">➡️</div>
        </div>

        <!-- Grupo de botones índice y home -->
        <div class="side-buttons">
            <div id="index" class="button">🔍</div>
            <div id="home" class="button">🏠</div>
        </div>

        <!-- Campo de estado del RFID -->
        <div class="side-buttons">
            <div class="rfid-status" id="rfid-status">RFID: No detectado</div>
            <p id="status">Estado: Esperando...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
